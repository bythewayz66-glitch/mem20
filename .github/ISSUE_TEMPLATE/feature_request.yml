name: Feature / enhancement request
description: Propose a new capability, tool, or improvement to mem20.
title: "[enhancement] <short description>"
labels: ["enhancement"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you unable to do today? Describe the need, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Link related tools or docs.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - mcp / tools
        - mem20unitiz
        - mem20runtime
        - web / gateway
        - blender / unity bridge
        - packaging / install
        - docs
        - unknown
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is done? List testable outcomes.
    validations:
      required: true
