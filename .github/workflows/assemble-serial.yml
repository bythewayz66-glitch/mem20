name: Assemble serial instalment

# One-shot assembler for docs/app/narrative/serial-2026-11-21.md.
# The publishing API rejects some larger single writes and appends one trailing
# newline to every file it writes, so the instalment is committed in small
# numbered parts under docs/app/narrative/.parts2/ and concatenated here in
# filename order, starting from EMPTY, with exactly one trailing newline
# stripped from each part to undo the API's addition. The job runs only when a
# DONE sentinel is present, and removes .parts2/ afterwards, so it cannot loop.

on:
  push:
    paths:
      - 'docs/app/narrative/.parts2/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Concatenate parts into the instalment
        run: |
          set -euo pipefail
          PARTS=docs/app/narrative/.parts2
          TARGET=docs/app/narrative/serial-2026-11-21.md
          if [ ! -f "$PARTS/DONE" ]; then
            echo "No DONE sentinel; nothing to assemble."
            exit 0
          fi
          ls -la "$PARTS"
          : > /tmp/assembled.md
          for f in $(ls "$PARTS"/*.md | sort); do
            echo "appending $f"
            # strip exactly one trailing newline (the API adds one per write)
            perl -0777 -pe 's/\n\z//' "$f" >> /tmp/assembled.md
          done
          mv /tmp/assembled.md "$TARGET"
          rm -rf "$PARTS"
          wc -c -w "$TARGET"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "mem20-naration-bot"
          git config user.email "noreply@github.com"
          git add -A docs/app/narrative
          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi
          git commit -m "docs(narrative): assemble serial 2026-11-21 from parts"
          git push
