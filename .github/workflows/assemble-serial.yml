name: Assemble serial instalment

# One-shot assembler for docs/app/narrative/serial-2026-11-21.md.
# The publishing API rejects some larger single writes and strips trailing
# whitespace from every file it writes, so the instalment is committed in small
# numbered parts under docs/app/narrative/.parts2/ and concatenated here in
# filename order, JOINED WITH A NEWLINE, with one final newline appended. The
# parts are split on line boundaries so that the API's trailing-whitespace strip
# removes only the newline the join puts back.
#
# TRIGGER: push of docs/app/narrative/.assemble-trigger ONLY, committed last
# once every part is in place.

on:
  push:
    paths:
      - 'docs/app/narrative/.assemble-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Concatenate parts into the instalment
        run: |
          set -euo pipefail
          PARTS=docs/app/narrative/.parts2
          TARGET=docs/app/narrative/serial-2026-11-21.md
          ls -la "$PARTS"
          first=1
          : > /tmp/assembled.md
          for f in $(ls "$PARTS"/*.md | sort); do
            echo "appending $f"
            if [ "$first" -eq 0 ]; then
              printf '\n' >> /tmp/assembled.md
            fi
            first=0
            cat "$f" >> /tmp/assembled.md
          done
          printf '\n' >> /tmp/assembled.md
          mv /tmp/assembled.md "$TARGET"
          rm -rf "$PARTS"
          rm -f docs/app/narrative/.assemble-trigger
          wc -c -w "$TARGET"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "mem20-naration-bot"
          git config user.email "noreply@github.com"
          git add -A docs/app/narrative
          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi
          git commit -m "docs(narrative): assemble serial 2026-11-21 from parts"
          git push
