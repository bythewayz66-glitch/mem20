name: Assemble serial instalment

# One-shot assembler for docs/app/narrative/serial-2026-11-21.md.
# The publishing API rejects some larger single writes and appends one trailing
# newline to every file it writes, so the instalment is committed in small
# numbered parts under docs/app/narrative/.parts2/ and concatenated here in
# filename order, with exactly one trailing newline stripped from each part to
# undo the API's addition.
#
# TRIGGER: push of docs/app/narrative/.assemble-trigger ONLY. An earlier version
# triggered on any .parts2/ push, which meant it fired on every part commit and
# deleted the parts directory after the first one, assembling a partial file.
# The trigger file is committed last, once every part is in place.
#
# MODE: if the target already exists, the parts are PREPENDED to it (the parts
# hold the head of the document and the existing target holds the tail). If the
# target does not exist, the parts become the whole document.

on:
  push:
    paths:
      - 'docs/app/narrative/.assemble-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Concatenate parts into the instalment
        run: |
          set -euo pipefail
          PARTS=docs/app/narrative/.parts2
          TARGET=docs/app/narrative/serial-2026-11-21.md
          ls -la "$PARTS"
          : > /tmp/head.md
          for f in $(ls "$PARTS"/*.md | sort); do
            echo "appending $f"
            perl -0777 -pe 's/\n\z//' "$f" >> /tmp/head.md
          done
          if [ -f "$TARGET" ]; then
            echo "target exists: prepending parts to it"
            cat /tmp/head.md "$TARGET" > /tmp/assembled.md
          else
            echo "target absent: parts are the whole document"
            cp /tmp/head.md /tmp/assembled.md
          fi
          mv /tmp/assembled.md "$TARGET"
          rm -rf "$PARTS"
          rm -f docs/app/narrative/.assemble-trigger
          wc -c -w "$TARGET"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "mem20-naration-bot"
          git config user.email "noreply@github.com"
          git add -A docs/app/narrative
          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi
          git commit -m "docs(narrative): assemble serial 2026-11-21 from parts"
          git push
