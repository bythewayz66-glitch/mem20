name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: Syntax gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A mode-160000 entry with no .gitmodules URL aborts `git submodule
      # update --recursive` (exit 128) and takes the Pages build down with it.
      # This guard fails fast so the accident cannot land again. See #54.
      - name: Guard against dangling gitlinks
        run: |
          bad=$(git ls-files --stage | awk '$1=="160000"{print $4}')
          if [ -n "$bad" ]; then
            echo "::error::Dangling gitlink(s) found (mode 160000) - these break recursive checkout (Pages)."
            echo "$bad"
            echo "Fix: add a real .gitmodules entry with a reachable URL, or vendor the content as plain tracked files."
            exit 1
          fi
          echo "no gitlinks - ok"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Scope note: this gate compiles every tracked module in the repo. The
      # previous `mcp_server_dir/` exclusion was a temporary scope limit for a
      # corrupt duplicate tree; that tree no longer exists (the mirror now lives
      # at `mem20_mcp/`, which parses clean), so excluding it only narrowed the
      # gate without buying anything. Only generated/vendor trees are skipped.
      - name: Compile every tracked module
        run: |
          find . \
            -path ./.git -prune -o \
            -path ./build -prune -o \
            -path ./node_modules -prune -o \
            -name __pycache__ -prune -o \
            -name '*.py' -print0 \
            | xargs -0 -n1 python3 -m py_compile
          echo "syntax gate passed"

  # Guards against the class of accident that broke the Pages build: a nested
  # working tree added with a bare `git add`, which records a gitlink (mode
  # 160000) but writes no .gitmodules entry. GitHub's legacy Pages builder runs
  # `actions/checkout` with `submodules: recursive`, which then aborts with
  #   fatal: No url found for submodule path '<path>' in .gitmodules
  # and fails the whole build before any site content is touched. See issue #54.
  gitlink-guard:
    name: Gitlink guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The index is all we inspect; recursing would defeat the purpose.
          submodules: false

      - name: Fail on dangling gitlinks (mode 160000)
        run: |
          set -uo pipefail

          # `grep` exits 1 when it finds nothing; `|| true` keeps that from
          # failing the step, so an empty index is a pass, not an error.
          matches="$(git ls-files --stage | grep '^160000' || true)"

          if [ -z "$matches" ]; then
            echo "OK: No gitlinks (mode 160000) in the index."
            exit 0
          fi

          # `git ls-files --stage` prints "<mode> <sha> <stage>\t<path>".
          paths="$(printf '%s\n' "$matches" | sed 's/^[^\t]*\t//')"
          count="$(printf '%s\n' "$paths" | grep -c .)"

          echo "::error::Found $count gitlink(s) in the index (mode 160000)."
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            echo "  - $p"
          done <<< "$paths"

          fail=0

          # Every gitlink must be declared in .gitmodules, or it is dangling.
          if [ ! -f .gitmodules ]; then
            echo "::error::.gitmodules is missing, but the index contains gitlinks."
            fail=1
          else
            declared="$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' 2>/dev/null | sed 's/^[^ ]* //' || true)"
            while IFS= read -r p; do
              [ -z "$p" ] && continue
              if ! printf '%s\n' "$declared" | grep -qxF "$p"; then
                echo "::error::gitlink '$p' has no matching path entry in .gitmodules"
                fail=1
              fi
            done <<< "$paths"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Fix: either remove the gitlink from the index, or declare it with"
            echo "     'git submodule add <url> <path>' so .gitmodules carries its URL."
            exit 1
          fi

          echo "OK: all gitlinks are declared in .gitmodules."

  tests:
    name: Tests (advisory)
    runs-on: ubuntu-latest
    # Advisory until the tree is fully green: the runtime needs heavy optional
    # deps (embedding models, blender) that are not installed in CI yet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest
      - name: Run tests
        run: python3 -m pytest -q
