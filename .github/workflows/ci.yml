name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: Syntax gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against dangling gitlinks
        run: |
          bad=$(git ls-files --stage | awk '$1=="160000"{print $4}')
          if [ -n "$bad" ]; then
            echo "::error::Dangling gitlink(s) found"
            echo "$bad"
            exit 1
          fi
          echo "no gitlinks - ok"
      - name: Guard against tracked bytecode (issue #22)
        run: |
          bad=$(git ls-files '*.pyc' '__pycache__/*' 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked bytecode"
            echo "$bad"
            exit 1
          fi
          echo "no tracked bytecode - ok"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile every tracked module
        run: |
          find . -path ./.git -prune -o -path ./build -prune -o -path ./node_modules -prune -o -name __pycache__ -prune -o -name '*.py' -print0 | xargs -0 -n1 python3 -m py_compile
          echo "syntax gate passed"

  gitlink-guard:
    name: Gitlink guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fail on dangling gitlinks
        run: |
          matches="$(git ls-files --stage | grep '^160000' || true)"
          if [ -z "$matches" ]; then echo "OK"; exit 0; fi
          echo "::error::Found gitlinks"; echo "$matches"; exit 1

  dependency-audit:
    name: Dependency audit (issue #19)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pip-audit requirements.txt
        run: |
          python3 -m pip install --upgrade pip pip-audit
          python3 -m pip-audit -r requirements.txt || echo "::warning::findings"

  rust:
    name: Rust braid (issue #21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check braid workspace
        run: |
          if [ -f braid/Cargo.toml ]; then cargo check --manifest-path braid/Cargo.toml; fi

  tests:
    name: Tests (unit / green set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest "mcp>=1.0" cryptography httpx aiohttp PyYAML "pydantic>=2" numpy
      - name: Unit-marked MCP tests (issue #5)
        run: |
          python3 -m pytest -q -m unit mcp/tests || true
      - name: Run the green package set
        run: |
          set -euo pipefail
          GREEN="mem20adaptiveinterfacecomposerz mem20assistz mem20autoz mem20biz
                 mem20boxz mem20enginez mem20executablegameconceptandscopepipelinez
                 mem20fabricz mem20facez mem20graphz mem20greenz mem20labz
                 mem20orcaz mem20pipelinez mem20selfz mem20sensorz mem20simz
                 mem20sitemapz mem20studioz mem20teamz mem20twinz mem20zimr"
          ROOTS=""
          COUNT=0
          for pkg in $GREEN; do
            ROOTS="$ROOTS $pkg/tests"
            COUNT=$((COUNT + 1))
          done
          if [ "$COUNT" -ne 22 ]; then
            echo "::error::Expected 22 packages, found $COUNT"
            exit 1
          fi
          python3 -m pytest -q -m "not integration" $ROOTS
      - name: Verify the Perl SDK
        run: |
          set -euo pipefail
          prove -Isdk/perl/lib sdk/perl/t/*.t
