name: MCP verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mcp-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handshake:
    name: MCP handshake (shallow clone)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # fetch-depth: 1 is intentional — this is the shallow-clone regression guard.
      - name: Checkout (shallow, no history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Confirm the checkout really is shallow
        run: |
          echo "is-shallow: $(git rev-parse --is-shallow-repository)"
          test "$(git rev-parse --is-shallow-repository)" = "true"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          # Install from requirements.txt, not a hand-written list. The hand
          # list drifted: it named four packages while requirements.txt
          # declared eight, and the two it omitted (mcp-types, and aiohttp at
          # the pinned floor) are imported at module scope by modules the
          # server loads before it can answer a single request. Sixteen runs
          # failed on that gap. The file is the source of truth; this step
          # reads it.
          python -m pip install -r requirements.txt

      - name: Verify the MCP handshake and tool count
        env:
          # 272 = 270 at v3.1.2 + vcs_asset_release_audit (RM-239, PR #157)
          #       + graph_execute_reversible_plan (RM-052, PR #158).
          # Bump this whenever a merged subsystem registers a new MCP tool.
          MEM20_EXPECTED_TOOLS: "272"
          PYTHONUNBUFFERED: "1"
        run: python ./verify_mcp.py
