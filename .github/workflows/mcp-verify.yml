name: MCP verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mcp-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handshake:
    name: MCP handshake (shallow clone)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # fetch-depth: 1 is intentional — this is the shallow-clone regression guard.
      - name: Checkout (shallow, no history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Confirm the checkout really is shallow
        run: |
          echo "is-shallow: $(git rev-parse --is-shallow-repository)"
          test "$(git rev-parse --is-shallow-repository)" = "true"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mcp>=2.1.1" "pydantic>=2.13.4" "anyio>=4.14.2" "aiohttp>=3.9"

      - name: Verify the MCP handshake and tool count
        env:
          # 290 = 272 after PRs #157/#158, plus the four 4.0 subsystem
          #       mixins merged in this pass:
          #         +4 corez      (PR #164)
          #         +2 toolchest  (PR #165)
          #         +4 verify     (PR #166)
          #         +3 ops        (PR #167)
          #       +5 gateway/other registrations from PR #168.
          # Bump this whenever a merged subsystem registers a new MCP tool.
          MEM20_EXPECTED_TOOLS: "290"
          PYTHONUNBUFFERED: "1"
        run: python ./verify_mcp.py
