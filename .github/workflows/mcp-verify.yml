name: MCP verify

# Proves the MCP server starts and registers its full tool table from a checkout with
# NO git history. The checkout below is deliberately shallow (`fetch-depth: 1`): if
# anything reintroduces a dependency on git history or a vendored artefact, this job
# fails instead of shipping a server that cannot start from `git clone --depth 1`.

on:
  push:
    branches: ["main", "copilot/**"]
    paths:
      - "mcp/**"
      - "mem20liez/**"
      - "launcher.py"
      - "verify_mcp.py"
      - ".github/workflows/mcp-verify.yml"
  pull_request:
    paths:
      - "mcp/**"
      - "mem20liez/**"
      - "launcher.py"
      - "verify_mcp.py"
      - ".github/workflows/mcp-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handshake:
    name: MCP handshake (shallow clone)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # fetch-depth: 1 is intentional — this is the shallow-clone regression guard.
      - name: Checkout (shallow, no history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Confirm the checkout really is shallow
        run: |
          echo "is-shallow: $(git rev-parse --is-shallow-repository)"
          test "$(git rev-parse --is-shallow-repository)" = "true"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mcp>=2.1.1" "pydantic>=2.13.4" "anyio>=4.14.2"

      - name: Verify the MCP handshake and tool count
        env:
          MEM20_EXPECTED_TOOLS: "270"
          PYTHONUNBUFFERED: "1"
        run: python ./verify_mcp.py
