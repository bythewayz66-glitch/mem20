name: mem20 web shell

# Builds the mem20 web shell from the committed web/ source tree and publishes
# the static bundle to docs/app/, which GitHub Pages serves at /mem20/app/.
#
# The tool catalog (web/src/data/tools.json) is GENERATED, not hand-written:
# it is AST-extracted from the estate's own mcp/tools/*.py, exactly as
# web/README.md documents. Regenerating it here keeps the catalog honest and
# reproducible from the repo alone.

on:
  workflow_dispatch:
  push:
    branches: [main, mem20frontendz]
    paths:
      - 'web/**'
      - '.github/workflows/mem20-web.yml'

permissions:
  contents: write

concurrency:
  group: mem20-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Regenerate tool catalog from source
        run: |
          set -euo pipefail
          python3 web/scripts/extract-tools.py --root . --out /tmp/raw-tools.json
          python3 - <<'PY'
          import json
          raw = json.load(open('/tmp/raw-tools.json'))
          # Keep the extractor's own record shape (n/t/d/x/p) and its header
          # fields. An earlier version of this step rewrote the records to
          # long keys and dropped domain_count, which is what left the three
          # view components reading keys the file no longer had.
          out = {
              "source": raw["source"],
              "files_scanned": raw["files_scanned"],
              "count": raw["count"],
              "domain_count": len({t["x"] for t in raw["tools"]}),
              "domains": sorted({t["x"] for t in raw["tools"]}),
              "tools": raw["tools"],
          }
          with open('web/src/data/tools.json', 'w') as fh:
              fh.write(json.dumps(out, separators=(",", ":")))
          print("tools.json:", out["count"], "tools across",
                out["domain_count"], "domains")
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install, typecheck, build
        working-directory: web
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Publish bundle to docs/app
        run: |
          set -euo pipefail
          # docs/app is NOT a build output directory. It also holds deck/,
          # narrative/ and desktop-packaging.md, which are hand-maintained and
          # are not produced by vite. `rm -rf docs/app` (the previous form of
          # this step) deleted all three on every run. Replace only the shell:
          # the bundle root files and assets/, leaving every other subtree.
          rm -rf docs/app/assets
          mkdir -p docs/app/assets
          cp -r web/dist/assets/. docs/app/assets/
          cp web/dist/index.html docs/app/index.html
          touch docs/app/.nojekyll
          echo "--- docs/app ---"
          find docs/app -type f | sort
          grep -o '<title>[^<]*</title>' docs/app/index.html

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "mem20-web-bot"
          git config user.email "mem20-web-bot@users.noreply.github.com"
          git add -A docs/app
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "build(web): publish mem20 web shell to docs/app"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
