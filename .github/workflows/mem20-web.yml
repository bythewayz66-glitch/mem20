name: mem20 web shell

# Builds the mem20 web shell from the committed web/ source tree and publishes
# the static bundle to docs/app/, which GitHub Pages serves at /mem20/app/.
#
# The tool catalog (web/src/data/tools.json) is GENERATED, not hand-written.
# Its authority is the live server's `tools/list` response, captured in
# docs/surface.json by scripts/surface_manifest.py. This workflow VALIDATES
# that the committed catalog still agrees with the docs; it does not rewrite
# it. Regenerate deliberately with `python3 scripts/surface_manifest.py
# --write` when the surface actually changes.

on:
  workflow_dispatch:
  push:
    branches: [main, mem20frontendz, fix/frontend-stale-refs]
    paths:
      - 'web/**'
      - '.github/workflows/mem20-web.yml'

permissions:
  contents: write

concurrency:
  group: mem20-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Validate the tool catalog against the committed surface
        run: |
          set -euo pipefail
          # The previous form of this step ran web/scripts/extract-tools.py and
          # wrote its output over web/src/data/tools.json. That extractor scans
          # every mcp/**/*.py module and reports a broader set (428 tools / 93
          # domains) than the live server answers (311 / 39, per
          # docs/surface.json). Overwriting the catalog with it published a
          # count the server does not serve. Validate instead of rewriting.
          python3 scripts/surface_manifest.py --check-docs
          python3 -c "import json;d=json.load(open('web/src/data/tools.json'));print('tools.json:',d['count'],'tools across',d['domain_count'],'domains')"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install, typecheck, build
        working-directory: web
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Publish bundle to docs/app
        run: |
          set -euo pipefail
          # docs/app is NOT a build output directory. It also holds deck/,
          # narrative/ and desktop-packaging.md, which are hand-maintained and
          # are not produced by vite. `rm -rf docs/app` (the previous form of
          # this step) deleted all three on every run. Replace only the shell:
          # the bundle root files and assets/, leaving every other subtree.
          rm -rf docs/app/assets
          mkdir -p docs/app/assets
          cp -r web/dist/assets/. docs/app/assets/
          cp web/dist/index.html docs/app/index.html
          touch docs/app/.nojekyll
          echo "--- docs/app ---"
          find docs/app -type f | sort
          grep -o '<title>[^<]*</title>' docs/app/index.html

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "mem20-web-bot"
          git config user.email "mem20-web-bot@users.noreply.github.com"
          git add -A docs/app
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "build(web): publish mem20 web shell to docs/app"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
