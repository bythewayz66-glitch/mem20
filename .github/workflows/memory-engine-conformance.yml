name: Memory Engine Conformance

on:
  push:
    branches: [main]
    paths:
      - 'memory_engine/**'
      - 'tests/backends/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'memory_engine/**'
      - 'tests/backends/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  conformance:
    name: Conformance (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [faiss, memory]
        include:
          - backend: faiss
            extra-deps: faiss-cpu
          - backend: memory
            extra-deps: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -e .[dev]
          if [ "${{ matrix.extra-deps }}" != "" ]; then
            pip install ${{ matrix.extra-deps }}
          fi
          # Install hnswlib for memory backend HNSW mode
          pip install hnswlib

      - name: Run conformance tests
        run: |
          pytest tests/backends/conformance.py -v --backend=${{ matrix.backend }} -x
        env:
          MEM20_STORE_PATH: /tmp/mem20-test-${{ matrix.backend }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.backend }}-results
          path: |
            .pytest_cache/
          retention-days: 7

  # Nightly extended test with all backends (when available)
  conformance-nightly:
    name: Conformance Nightly (all backends)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        backend: [faiss, memory, pgvector, qdrant]
        include:
          - backend: faiss
            extra-deps: faiss-cpu
          - backend: memory
            extra-deps: hnswlib
          - backend: pgvector
            extra-deps: "psycopg[pool] pgvector"
            services:
              postgres:
                image: pgvector/pgvector:pg16
                env:
                  POSTGRES_PASSWORD: postgres
                  POSTGRES_DB: mem20_test
                ports: ["5432:5432"]
                options: >-
                  --health-cmd "pg_isready -U postgres"
                  --health-interval 10s
                  --health-timeout 5s
                  --health-retries 5
          - backend: qdrant
            extra-deps: qdrant-client
            services:
              qdrant:
                image: qdrant/qdrant:latest
                ports: ["6333:6333", "6334:6334"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -e .[dev]
          if [ "${{ matrix.extra-deps }}" != "" ]; then
            pip install ${{ matrix.extra-deps }}
          fi

      - name: Run conformance tests
        run: |
          pytest tests/backends/conformance.py -v --backend=${{ matrix.backend }} -x
        env:
          MEM20_STORE_PATH: /tmp/mem20-test-${{ matrix.backend }}
          PGVECTOR_DSN: postgresql://postgres:postgres@localhost:5432/mem20_test
          QDRANT_URL: http://localhost:6333

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-nightly-${{ matrix.backend }}-results
          path: .pytest_cache/
          retention-days: 7