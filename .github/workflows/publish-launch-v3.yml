name: publish-launch-v3

# TEMPORARY, SELF-DELETING. One-shot job used to land the republished /sites/
# launch page (mem20-launch_v3) into published/sites/ byte-exactly.
#
# Why a workflow instead of a direct commit: the sandbox has no git write
# credentials, and the GitHub contents API would require re-transmitting ~40 KB
# of HTML by hand. Instead this derives the file on the runner from
# docs/index.html with four anchored replacements, which is deterministic, and
# prints the resulting sha256 so the byte-identity can be verified against the
# build reviewed locally.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-launch-v3.yml'

permissions:
  contents: write

concurrency:
  group: publish-launch-v3
  cancel-in-progress: false

jobs:
  publish:
    name: publish launch v3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Derive, verify and record
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, re, sys

          SITE = "0325f63d-8afb-4994-bd20-3a11882a4830"
          REL = f"published/sites/{SITE}/webpages/mem20-launch_v3/index.html"

          src = pathlib.Path("docs/index.html")
          h = src.read_text(encoding="utf-8")

          SUBS = [
              ("promotion, and an append-only, origin-tagged ledger. 268 tools across 26 domains.",
               "promotion, and an append-only, origin-tagged ledger. 270 tools across 27 domains."),
              # em dash (U+2014) written literally: inside a shell heredoc \uXXXX would
              # stay as literal backslash-u text and never match the HTML.
              ("JSON-RPC 2.0 over stdio, 268 tools across 26 domains — drops into LangGraph, CrewAI, Pydantic AI and the wider MCP ecosystem.",
               "JSON-RPC 2.0 over stdio, 270 tools across 27 domains — drops into LangGraph, CrewAI, Pydantic AI and the wider MCP ecosystem."),
              ("MCP-native: JSON-RPC 2.0 over stdio, 268 tools across 26 domains.",
               "MCP-native: JSON-RPC 2.0 over stdio, 270 tools across 27 domains."),
              ("<li>268 tools · 26 domains</li>",
               "<li>270 tools · 27 domains</li>"),
          ]

          applied = 0
          for old, new in SUBS:
              if old in h:
                  assert h.count(old) == 1, f"ambiguous anchor: {old[:60]}"
                  h = h.replace(old, new)
                  applied += 1
              else:
                  print(f"::warning::anchor already updated or absent: {old[:60]}")

          # Hard gate: the published page must not carry any stale count.
          stale = re.findall(r"268 tools|26 domains|~258|~260|257 tools", h)
          if stale:
              print(f"::error::stale tool-count strings remain: {sorted(set(stale))}")
              sys.exit(1)
          if "270 tools" not in h or "27 domains" not in h:
              print("::error::expected 270 tools / 27 domains not present")
              sys.exit(1)

          out = pathlib.Path(REL)
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(h, encoding="utf-8", newline="")

          data = out.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          print(f"replacements_applied: {applied}")
          print(f"published_path: {REL}")
          print(f"published_bytes: {len(data)}")
          print(f"published_sha256: {digest}")
          print(f"source_sha256: {hashlib.sha256(src.read_bytes()).hexdigest()}")
          print(f"expected_sha256: f51d90458858f32c612262f9da4458f127016d7845d44f0acdce3b053672e4d5")
          if digest != "f51d90458858f32c612262f9da4458f127016d7845d44f0acdce3b053672e4d5":
              print("::warning::sha256 differs from the locally reviewed build (docs/index.html may have moved)")

          # --- manifest row (CRLF, tab separated, appended) ---
          man = pathlib.Path("published/MANIFEST.tsv")
          raw = man.read_bytes().decode("utf-8")
          row = f"{REL}\t{len(data)}\t{digest}"
          if REL in raw:
              print("manifest row already present; leaving as-is")
          else:
              if not raw.endswith("\r\n"):
                  raw += "\r\n"
              raw += row + "\r\n"
              man.write_bytes(raw.encode("utf-8"))
              print(f"manifest_rows: {len([l for l in raw.splitlines() if l.strip()]) - 1}")
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          rm -f .b64-probe-test.txt
          rm -f .github/workflows/publish-launch-v3.yml
          git config user.name "mem20-webdev"
          git config user.email "mem20-webdev@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          cat > /tmp/msg.txt <<'MSG'
          publish: mem20-launch_v3 - republish /sites/ launch page at 270 tools / 27 domains

          Derived from docs/index.html with four anchored corrections (268/26 -> 270/27),
          matching the handshake-verified surface (270 tools) and the P1 target.
          Records the file in published/MANIFEST.tsv with its byte size and SHA-256.
          Also removes the one-shot publish workflow and a base64 probe file.
          MSG
          sed -i 's/^          //' /tmp/msg.txt
          git commit -F /tmp/msg.txt
          git push origin HEAD:main
