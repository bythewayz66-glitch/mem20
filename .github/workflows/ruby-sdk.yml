name: Ruby SDK

# CI for the mem20 Ruby SDK (mem20-sdk-ruby/).
# This workflow lives at the REPOSITORY ROOT on purpose: GitHub only executes
# workflows from .github/workflows/ at the repo root, so a workflow nested
# inside mem20-sdk-ruby/.github/ would never run.
on:
  push:
    branches: [main]
    paths:
      - "mem20-sdk-ruby/**"
      - ".github/workflows/ruby-sdk.yml"
  pull_request:
    branches: [main]
    paths:
      - "mem20-sdk-ruby/**"
      - ".github/workflows/ruby-sdk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    # Pinned, not ubuntu-latest: `ubuntu-latest` now resolves to ubuntu-26.04,
    # which ruby/setup-ruby has no prebuilt 3.1/3.2/3.3 for. The job then dies
    # at the setup step with "Unavailable version 3.1.7 for ruby on
    # ubuntu-26.04" before any gem code runs. 24.04 is covered by the matrix.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3"]
    defaults:
      run:
        working-directory: mem20-sdk-ruby
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: mem20-sdk-ruby

      - name: Syntax check
        run: |
          for f in $(find lib -name '*.rb'); do
            ruby -c "$f"
          done

      - name: RSpec
        # Hermetic: the transport specs spawn spec/support/mini_mcp_server.rb,
        # so CI needs neither Python nor a running mem20 server.
        run: bundle exec rspec --format documentation

      - name: RuboCop
        run: bundle exec rubocop --format simple

      - name: Build gem
        run: gem build mem20-sdk.gemspec
