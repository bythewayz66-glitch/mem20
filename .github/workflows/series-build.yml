name: Series build

# Rebuilds the /series/ reader pages from what actually exists in the repo,
# commits the result, and deploys docs/ to GitHub Pages.
#
# Why this exists: the series pages are generated, not hand-written. The
# generator reads the finished comic PDFs under comics/the-z-corps/ and the
# chronicle chapters under docs/app/narrative/, then writes one reader page per
# issue and per installment plus the two index pages, the two JSON feeds and
# the RSS feed. Committing the generator and running it here means the pages
# can never drift from the corpus they claim to describe.
#
# A commit made with GITHUB_TOKEN does not trigger other workflows, so this
# workflow deploys Pages itself rather than relying on pages.yml to fire.

on:
  push:
    branches: [main]
    paths:
      - 'docs/series/_build.py'
      - 'comics/the-z-corps/**'
      - 'docs/app/narrative/**'
      - '.github/workflows/series-build.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Same group as pages.yml so the two deploys serialise instead of racing.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate the series pages
        run: |
          set -euo pipefail
          python3 docs/series/_build.py

      - name: Verify the generated corpus
        run: |
          set -euo pipefail
          comics=$(ls docs/series/comic/issue-*.html | wc -l)
          chrons=$(ls docs/series/chronicles/[0-9]*.html | wc -l)
          echo "comic readers: $comics"
          echo "chronicle readers: $chrons"
          test "$comics" -ge 12 || { echo "::error::expected at least 12 comic readers, got $comics"; exit 1; }
          test "$chrons" -ge 30 || { echo "::error::expected at least 30 chronicle readers, got $chrons"; exit 1; }
          python3 docs/series/_verify.py

      - name: Commit the regenerated pages
        run: |
          set -euo pipefail
          git config user.name  "mem20 series build"
          git config user.email "series-build@mem20.com"
          git add docs/series
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "series: regenerate reader pages from the corpus

            Generated by docs/series/_build.py from the finished comic PDFs and
            the chronicle chapters. Index pages, JSON feeds and RSS are written
            in the same pass so they cannot disagree."
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
