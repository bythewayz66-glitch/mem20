[workspace]
resolver = "2"
members = [
    "braid_core",
    "braid_keys",
    "braid_wire",
    "braid_ui_bridge",
    "braid_drive",
    "braid_her",
    "braid_sonic",
    "braid_cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
blake3 = "1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
# rand MUST track the rand_core major that ed25519-dalek 3 re-exports.
# dalek 3 depends on rand_core 0.10, whose RNG traits (`TryRng`/`TryCryptoRng`)
# are what `SigningKey::generate` bounds on. rand 0.8's `rngs::OsRng` only
# implements rand_core 0.6's `RngCore`/`CryptoRng`, so every
# `SigningKey::generate(&mut OsRng)` fails with "the trait bound `OsRng:
# CryptoRng` is not satisfied". rand 0.10 ships `rand::rng()` (ThreadRng),
# which implements the 0.10 traits. Keep these two pins in lockstep.
rand = "0.10"
serde = { version = "1", features = ["derive"] }
# float_roundtrip is REQUIRED for content addressing, not an optimisation.
# Without it serde_json parses decimals with a fast approximate
# `significand as f64 * POW10[exp]` that is off by up to 1 ULP. A commit
# receives its f64 bit-exact from the caller, but a later read recovers the
# value from decimal text - so the CID hashed at write time can never be
# re-derived, and every node holding an "unlucky" float fails verify() forever
# with its content and signature intact. Correctly-rounded parsing makes the
# canonical form stable and recovers those records.
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
sha2 = "0.11"
# hmac MUST track sha2's digest major. sha2 0.11 builds on digest 0.11 (it is
# also the version ed25519-dalek v3 pulls in, so cargo unifies the whole
# workspace on it). hmac 0.12 is a digest 0.10 crate: pairing the two gives
# `Hmac<Sha256>` an `HmacCore<Sha256>` that implements digest 0.10's
# `MacMarker`/`Update`/`FixedOutput` while `Mac` is re-exported from digest
# 0.11, so `HmacSha256::new_from_slice` reports E0599/E0277 unsatisfied trait
# bounds. Keep these two pins in lockstep - issue #21.
hmac = "0.13"
bs58 = "0.5"

[profile.release]
opt-level = 3