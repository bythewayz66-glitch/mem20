<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Micro-SaaS Foundry — estate monitor</title>
<link rel="stylesheet" href="../../../mem20autonomousmicrosaasfoundryz/mem20autonomousmicrosaasfoundryz/web/style.css"/></head><body>
<header class="topbar"><div class="brand"><span class="dot"></span><div><h1>Autonomous Micro-SaaS Foundry</h1><p class="sub">docs/app monitor</p></div></div>
<div class="api-config"><label>API</label><input id="api-base" placeholder="http://127.0.0.1:8783"/><button id="api-save" class="ghost">Connect</button>
<span class="pill"><a href="../README.md">docs/app</a> · <a href="../../../mem20autonomousmicrosaasfoundryz/README.md">README</a></span></div></header>
<main><section class="panel"><div class="panel-head"><h2>Run</h2></div><pre class="output">PYTHONPATH=/opt/mem20 /opt/mem20/.venv/bin/python -m mem20autonomousmicrosaasfoundryz serve --port 8783</pre></section>
<section class="stats" id="stats"></section><div class="grid"><section class="panel"><div class="panel-head"><h2>Foundry report</h2><button id="run-report" class="primary small">Run report</button></div><pre id="report" class="output"></pre></section>
<section class="panel"><div class="panel-head"><h2>Peers & doctor</h2><button id="run-doctor" class="ghost small">Probe peers</button></div><div id="peers" class="list"></div><pre id="doctor" class="output" hidden></pre></section></div>
<div class="grid"><section class="panel"><div class="panel-head"><h2>Score idea</h2></div><form id="score-form" class="stack"><div class="row"><input name="market_size" type="number" value="800"/><input name="competition" type="number" value="2"/><input name="effort" type="number" value="3"/></div><button type="submit">Score</button></form><pre id="ops" class="output"></pre></section>
<section class="panel"><div class="panel-head"><h2>Simulator & events</h2><div class="row"><button id="run-sim" class="ghost small">Simulate</button><button id="refresh-events" class="ghost small">Events</button></div></div><pre id="sim" class="output"></pre><ol id="events" class="events"></ol></section></div>
</main><div id="toast" class="toast" hidden></div><script src="../../../mem20autonomousmicrosaasfoundryz/mem20autonomousmicrosaasfoundryz/web/app.js" type="module"></script></body></html>
