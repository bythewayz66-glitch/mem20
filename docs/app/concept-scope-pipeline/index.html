<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Concept & Scope Pipeline monitor</title>
<style>body{font:14px system-ui;margin:0;background:#14121a;color:#eee8ff}header{padding:14px 18px;background:#1e1a29;border-bottom:1px solid #3b3352}main{padding:14px;max-width:1100px;margin:0 auto}.panel{background:#1e1a29;border:1px solid #3b3352;border-radius:10px;padding:12px;margin:12px 0}input{width:340px;max-width:100%;padding:6px;background:#0f0d15;color:#fff;border:1px solid #4a3f66;border-radius:6px}button{background:#7a5af8;color:#fff;border:0;border-radius:7px;padding:7px 11px;cursor:pointer}pre{white-space:pre-wrap;background:#0f0d15;padding:10px;border-radius:8px;max-height:300px;overflow:auto}code{background:#2a2440;padding:2px 5px;border-radius:4px}</style></head>
<body><header><h1>Executable Game Concept & Scope Pipeline monitor (RM-237, #309)</h1><p>Start: <code>PYTHONPATH=/opt/mem20 python3 -m mem20pipez serve --port 8789</code></p></header>
<main><div class="panel"><label>API <input id="a" value="http://127.0.0.1:8789"/></label> <button id="l">Load</button> <button id="d">Doctor</button></div>
<div class="panel"><h2>Spec/Metrics</h2><pre id="s"></pre></div><div class="panel"><h2>Doctor (6 peers)</h2><pre id="o"></pre></div></main>
<script>const a=document.getElementById('a'),q=new URLSearchParams(location.search);a.value=q.get('api')||localStorage.getItem('csp_api')||a.value;const b=()=>a.value.replace(/\/$/,'');async function g(p){return (await fetch(b()+p)).json()}document.getElementById('l').onclick=async()=>{localStorage.setItem('csp_api',a.value);try{const [sp,m]=await Promise.all([g('/spec'),g('/metrics')]);document.getElementById('s').textContent=JSON.stringify({id:sp.id,title:sp.title,metrics:m},null,2)}catch(e){document.getElementById('s').textContent=String(e)}};document.getElementById('d').onclick=async()=>{try{document.getElementById('o').textContent=JSON.stringify(await g('/doctor'),null,2)}catch(e){document.getElementById('o').textContent=String(e)}};if(q.get('api'))document.getElementById('l').onclick();</script></body></html>
