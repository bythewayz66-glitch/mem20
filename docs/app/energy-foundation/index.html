<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>mem20 energy foundation monitor</title>
<style>body{font:14px system-ui;margin:0;background:#10140a;color:#eef7df}header{padding:14px 18px;background:#1b2312;border-bottom:1px solid #3d4a28}main{padding:14px}.panel{background:#1b2312;border:1px solid #3d4a28;border-radius:10px;padding:12px;margin:12px 0}input{width:340px;padding:6px;background:#0b1007;color:#fff;border:1px solid #485;border-radius:6px}button{background:#5a8a1f;color:#fff;border:0;border-radius:7px;padding:7px 11px}pre{white-space:pre-wrap;background:#0b1007;padding:10px;border-radius:8px;max-height:300px;overflow:auto}</style></head>
<body><header><h1>Energy-Aware Foundation monitor</h1><p>Start: <code>python -m mem20energyawarefoundationz serve --port 8784</code></p></header>
<main><div class="panel"><label>API <input id="a" value="http://127.0.0.1:8784"/></label> <button id="l">Load</button> <button id="d">Doctor</button></div><div class="panel"><h2>Status</h2><pre id="s"></pre></div><div class="panel"><h2>Doctor</h2><pre id="o"></pre></div></main>
<script>const a=document.getElementById('a'),q=new URLSearchParams(location.search);a.value=q.get('api')||localStorage.getItem('eaf_api')||a.value;const b=()=>a.value.replace(/\/$/,'');async function g(p){return (await fetch(b()+p)).json()}document.getElementById('l').onclick=async()=>{localStorage.setItem('eaf_api',a.value);try{document.getElementById('s').textContent=JSON.stringify(await g('/api/status'),null,2)}catch(e){document.getElementById('s').textContent=String(e)}};document.getElementById('d').onclick=async()=>{try{document.getElementById('o').textContent=JSON.stringify(await g('/api/doctor'),null,2)}catch(e){document.getElementById('o').textContent=String(e)}};if(q.get('api'))document.getElementById('l').onclick();</script></body></html>
