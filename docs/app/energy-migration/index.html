<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>mem20 energy-aware migration monitor</title>
<style>body{font:14px system-ui;margin:0;background:#07140f;color:#dff7ea}header{padding:14px 18px;background:#0d2319;border-bottom:1px solid #1f4a34}main{padding:14px;max-width:1100px;margin:0 auto}.panel{background:#0d2319;border:1px solid #1f4a34;border-radius:10px;padding:12px;margin:12px 0}input{width:340px;max-width:100%;padding:6px;background:#04100b;color:#eafff4;border:1px solid #2a5;border-radius:6px}button{background:#1f8a52;color:#fff;border:0;border-radius:7px;padding:7px 11px;cursor:pointer;margin-left:6px}pre{white-space:pre-wrap;background:#04100b;padding:10px;border-radius:8px;max-height:300px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}</style></head>
<body><header><h1>Energy-Aware Compute Migration monitor (RM-047)</h1><p>Static monitor. Start: <code>python -m mem20energyawarecomputemigrationz serve --port 8783</code></p></header>
<main><div class="panel"><label>API <input id="api" value="http://127.0.0.1:8783"/></label><button id="load">Load</button><button id="doctor">Doctor</button></div>
<div class="grid"><div class="panel"><h2>Status</h2><pre id="status"></pre></div><div class="panel"><h2>Doctor</h2><pre id="doctor"></pre></div></div>
<div class="grid"><div class="panel"><h2>Nodes</h2><pre id="nodes"></pre></div><div class="panel"><h2>Workloads</h2><pre id="wls"></pre></div></div></main>
<script>
const a=document.getElementById('api'); const qs=new URLSearchParams(location.search); a.value=qs.get('api')||localStorage.getItem('eam_api')||a.value;
const base=()=>a.value.replace(/\/$/,''); async function get(p){return (await fetch(base()+p)).json()}
async function load(){localStorage.setItem('eam_api',a.value); try{const [s,n,w]=await Promise.all([get('/api/status'),get('/api/nodes'),get('/api/workloads')]); document.getElementById('status').textContent=JSON.stringify(s.summary||s,null,2); document.getElementById('nodes').textContent=JSON.stringify(n.nodes||n,null,2); document.getElementById('wls').textContent=JSON.stringify(w.workloads||w,null,2);}catch(e){document.getElementById('status').textContent=String(e)}}
document.getElementById('load').onclick=load; document.getElementById('doctor').onclick=async()=>{try{document.getElementById('doctor').textContent=JSON.stringify(await get('/api/doctor'),null,2)}catch(e){document.getElementById('doctor').textContent=String(e)}}; if(qs.get('api')) load();
</script></body></html>
