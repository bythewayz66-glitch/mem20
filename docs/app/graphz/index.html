<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>mem20graphz monitor</title>
<style>body{font:14px system-ui;margin:0;background:#101418;color:#e6eef4}header{padding:14px 18px;background:#17202a;border-bottom:1px solid #304050}main{padding:14px;max-width:1000px;margin:0 auto}.panel{background:#17202a;border:1px solid #304050;border-radius:10px;padding:12px;margin:12px 0}input{width:340px;max-width:100%;padding:6px;background:#0b1014;color:#fff;border:1px solid #3d5268;border-radius:6px}button{background:#3f8ecf;color:#fff;border:0;border-radius:7px;padding:7px 11px}pre{white-space:pre-wrap;background:#0b1014;padding:10px;border-radius:8px;max-height:320px;overflow:auto}</style></head>
<body><header><h1>mem20graphz crew monitor (#321)</h1><p>Start: <code>PYTHONPATH=/opt/mem20 python3 -m mem20graphz serve --port 8801</code></p></header>
<main><div class="panel"><label>API <input id="a" value="http://127.0.0.1:8801"/></label> <button id="d">Doctor</button> <button id="s">Status</button></div><div class="panel"><pre id="o">ready</pre></div></main>
<script>const a=document.getElementById('a'),o=document.getElementById('o'),b=()=>a.value.replace(/\/$/,'');async function g(p){o.textContent=JSON.stringify(await (await fetch(b()+p)).json(),null,2)}document.getElementById('d').onclick=()=>g('/doctor');document.getElementById('s').onclick=()=>g('/status');</script></body></html>
