<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Hardware Marketplace monitor</title></head>
<body style="font:14px system-ui;background:#0f1318;color:#e8eef5;padding:16px"><h1>Hardware Marketplace monitor (RM-048, #323)</h1>
<p>Start: <code>PYTHONPATH=/opt/mem20 python3 -m mem20hardwaremarketplacez serve --port 8803</code></p>
<label>API <input id="a" value="http://127.0.0.1:8803" style="width:320px"/></label> <button id="l">Load</button> <button id="d">Doctor</button>
<h2>Spec/Metrics</h2><pre id="s" style="background:#0b1015;padding:10px;white-space:pre-wrap"></pre><h2>Doctor</h2><pre id="o" style="background:#0b1015;padding:10px;white-space:pre-wrap"></pre>
<script>const a=document.getElementById("a"),b=()=>a.value.replace(/\/$/,"");async function g(p){return (await fetch(b()+p)).json()}
document.getElementById("l").onclick=async()=>{try{const [sp,m]=await Promise.all([g("/spec"),g("/metrics")]);s.textContent=JSON.stringify({id:sp.id,title:sp.title,metrics:m},null,2)}catch(e){s.textContent=String(e)}};
document.getElementById("d").onclick=async()=>{try{o.textContent=JSON.stringify(await g("/doctor"),null,2)}catch(e){o.textContent=String(e)}};</script></body></html>
