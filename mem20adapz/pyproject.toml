[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20adapz"
version = "1.0.0"
description = "mem20 adaptive systems runtime — first-class unified implementation of all adaptive organs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mem20", "adaptive", "runtime"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mem20adapz = "mem20adapz.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mem20adapz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
