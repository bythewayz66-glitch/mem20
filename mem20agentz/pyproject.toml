[project]
name = "mem20agentz"
version = "0.1.0"
description = "mem20 agent platform — all known agent features, built directly into mem20"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "aiohttp>=3.9",
  # Imported at module scope by llm.py, mcp.py, security.py and
  # bridges/telegram.py. It was undeclared, so a clean install of mem20agentz
  # imported the package fine but failed on `import mem20agentz.llm`. See #29.
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
# OREO engine (natural language -> graph -> runnable app). Lives in its own
# public repo; pinned to the commit that restructured it into the `mem20oreo`
# package. Declared as a git-URL dependency rather than a submodule so the
# Pages checkout / gitlink guard stay clean (see 71939ee, #30).
oreo = [
  "mem20oreo @ git+https://github.com/JaysonAIOnline/oreo.git@51876daba59cd68932fa57b50fbdade0fb3703c2",
]

[project.scripts]
mem20agentz = "mem20agentz.cli:main"
mem20 = "mem20agentz.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mem20agentz", "mem20agentz.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
