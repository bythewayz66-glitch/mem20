[project]
name = "mem20agentz"
version = "0.1.0"
description = "mem20 agent platform — all known agent features, built directly into mem20"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "aiohttp>=3.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
# OREO is a gitlink / separate package — install when available:
#   pip install -e ./mem20oreo   # or submodule
oreo = []

[project.scripts]
mem20agentz = "mem20agentz.cli:main"
mem20 = "mem20agentz.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mem20agentz", "mem20agentz.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
