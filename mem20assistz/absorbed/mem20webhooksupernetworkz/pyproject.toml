[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20webhooksupernetworkz"
version = "0.1.0"
description = "Webhook Supernetwork — verified, idempotent webhook delivery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mem20webhooksupernetworkz = "mem20webhooksupernetworkz.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mem20webhooksupernetworkz*"]

[tool.ruff]
target-version = "py311"
line-length = 100
