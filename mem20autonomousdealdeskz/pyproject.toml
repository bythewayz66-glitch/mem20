[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20autonomousdealdeskz"
version="1.0.0"
description="Autonomous deal desk with 6 subsystem-specific peer integrations, HTTP cockpit, and MCP tools"
requires-python=">=3.11"

[project.scripts]
mem20autonomousdealdeskz="mem20autonomousdealdeskz.runtime:main"

[tool.setuptools]
packages=["mem20autonomousdealdeskz"]

[tool.setuptools.package-data]
mem20autonomousdealdeskz=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
