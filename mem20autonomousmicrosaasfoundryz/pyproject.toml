[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20autonomousmicrosaasfoundryz"
version="1.0.0"
description="Autonomous micro-SaaS foundry with 6 subsystem-specific peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20autonomousmicrosaasfoundryz="mem20autonomousmicrosaasfoundryz.runtime:main"
[tool.setuptools]
packages=["mem20autonomousmicrosaasfoundryz"]
[tool.setuptools.package-data]
mem20autonomousmicrosaasfoundryz=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
