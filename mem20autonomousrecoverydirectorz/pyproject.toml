[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20autonomousrecoverydirectorz"
version="1.0.0"
description="Autonomous recovery director with 6 subsystem-specific peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20autonomousrecoverydirectorz="mem20autonomousrecoverydirectorz.runtime:main"
[tool.setuptools]
packages=["mem20autonomousrecoverydirectorz"]
[tool.setuptools.package-data]
mem20autonomousrecoverydirectorz=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
