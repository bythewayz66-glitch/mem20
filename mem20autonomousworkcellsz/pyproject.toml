[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20autonomousworkcellsz"
version="1.0.0"
description="Autonomous workcells with 6 workcell-specific peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20autonomousworkcellsz="mem20autonomousworkcellsz.runtime:main"
[tool.setuptools]
packages=["mem20autonomousworkcellsz"]
[tool.setuptools.package-data]
mem20autonomousworkcellsz=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
