[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20controlz"
version = "0.1.0"
description = "Unified control plane for the mem20 fleet: per-subsystem panels (REST-first, CLI fallback) plus the Websites manager for deploys, health, logs and Cloudflare DNS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mem20", "control-plane", "fleet", "fastapi", "websites", "dns"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # Sibling monorepo packages — install with:
    #   pip install -e ./mem20ops -e ./mem20dreamz -e "./mem20controlz[dev]"
    "mem20ops",
    "mem20dreamz",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
mem20-control = "mem20controlz.__main__:main"

[tool.setuptools]
packages = ["mem20controlz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "."]
