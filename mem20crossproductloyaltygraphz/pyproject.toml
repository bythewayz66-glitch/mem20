[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20crossproductloyaltygraphz"
version="1.0.0"
description="Cross-Product Loyalty Graph with 6 peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20crossproductloyaltygraphz="mem20crossproductloyaltygraphz.runtime:main"
[tool.setuptools]
packages=["mem20crossproductloyaltygraphz"]
[tool.setuptools.package-data]
mem20crossproductloyaltygraphz=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
