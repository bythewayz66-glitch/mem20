[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20demandforecastandcapacitybrainz"
version = "0.1.0"
description = "Demand Forecast and Capacity Brain — forecast demand and plan capacity."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mem20demandforecastandcapacitybrainz = "mem20demandforecastandcapacitybrainz:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mem20demandforecastandcapacitybrainz*"]

[tool.ruff]
target-version = "py311"
line-length = 100
