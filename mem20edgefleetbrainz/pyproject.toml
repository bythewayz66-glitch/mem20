[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20edgefleetbrainz"
version="1.0.0"
description="Edge Fleet Brain: one capability-aware fleet over heterogeneous hardware"
requires-python=">=3.11"

[project.scripts]
mem20edgefleetbrainz="mem20edgefleetbrainz.runtime:main"

[tool.setuptools]
packages=["mem20edgefleetbrainz"]

[tool.setuptools.package-data]
mem20edgefleetbrainz=["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
