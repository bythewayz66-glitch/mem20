<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Energy-Aware Foundation</title><link rel="stylesheet" href="/style.css"/></head>
<body><header><h1>Energy-Aware Foundation <small>RM</small></h1><div><button id="r">Refresh</button> <button id="d">Doctor</button> <button id="s">Simulate</button></div></header>
