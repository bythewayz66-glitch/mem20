<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Community Challenge Engine — cockpit</title><link rel="stylesheet" href="./style.css"/></head><body>
<header class="topbar"><div class="brand"><span class="dot"></span><div><h1>Community Challenge Engine</h1><p class="sub">challenges/leaderboards/rewards · 6 peers</p></div></div><div class="api-config"><label>API</label><input id="api-base" placeholder="same origin"/><button id="api-save" class="ghost">Connect</button></div></header>
<main><section class="stats" id="stats"></section><div class="grid"><section class="panel"><div class="panel-head"><h2>Challenge report</h2><button id="run-report" class="primary small">Run report</button></div><pre id="report" class="output"></pre></section>
<section class="panel"><div class="panel-head"><h2>Peers & doctor</h2><button id="run-doctor" class="ghost small">Probe peers</button></div><div id="peers" class="list"></div><pre id="doctor" class="output" hidden></pre></section></div>
<section class="panel"><div class="panel-head"><h2>Simulator & events</h2><div class="row"><button id="run-sim" class="ghost small">Simulate</button><button id="refresh-events" class="ghost small">Events</button></div></div><pre id="sim" class="output"></pre><ol id="events" class="events"></ol></section></main>
<div id="toast" class="toast" hidden></div><script src="./app.js" type="module"></script></body></html>
