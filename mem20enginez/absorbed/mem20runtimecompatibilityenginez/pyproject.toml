[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20runtimecompatibilityenginez"
version="1.0.0"
description="Runtime Compatibility Engine with 6 peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20runtimecompatibilityenginez="mem20runtimecompatibilityenginez.runtime:main"
[tool.setuptools]
packages=["mem20runtimecompatibilityenginez"]
[tool.setuptools.package-data]
mem20runtimecompatibilityenginez=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
