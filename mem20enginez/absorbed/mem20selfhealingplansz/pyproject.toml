[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20selfhealingplansz"
version="1.0.0"
description="Self-Healing Plans with 6 peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20selfhealingplansz="mem20selfhealingplansz.runtime:main"
[tool.setuptools]
