[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20enginez"
version = "1.0.0"
description = "mem20 crew runtime: member registry, probing, compatibility/dispatch planning, durable state, CLI/HTTP API for 30 engine members"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mem20", "crew", "runtime", "engine", "integration"]
dependencies = []

[project.scripts]
mem20enginez = "mem20enginez.runtime:main"

[tool.setuptools]
packages = ["mem20enginez", "mem20enginez.mem20enginez"]

[tool.setuptools.package-data]
"mem20enginez.mem20enginez" = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
