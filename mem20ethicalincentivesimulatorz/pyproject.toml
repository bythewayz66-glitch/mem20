[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20ethicalincentivesimulatorz"
version="1.0.0"
description="Ethical Incentive Simulator (RM-203): behavior/incentive simulation with fairness, harm/manipulation safeguards, and peer outcome/risk analysis"
requires-python=">=3.11"

[project.scripts]
mem20ethicalincentivesimulatorz="mem20ethicalincentivesimulatorz.runtime:main"

[tool.setuptools]
packages=["mem20ethicalincentivesimulatorz"]
[tool.setuptools.package-data]
mem20ethicalincentivesimulatorz=["CAPABILITY.json","roadmap.json","web/*"]
