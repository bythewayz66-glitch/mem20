[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20executabledesignstresslabz"
version="1.0.0"
description="Executable Design Stress Lab (RM-221): simulated design/player/production/technical stress tests with resilience and QA peer signals"
requires-python=">=3.11"

[project.scripts]
mem20executabledesignstresslabz="mem20executabledesignstresslabz.runtime:main"

[tool.setuptools]
packages=["mem20executabledesignstresslabz"]
[tool.setuptools.package-data]
mem20executabledesignstresslabz=["CAPABILITY.json","roadmap.json","web/*"]
