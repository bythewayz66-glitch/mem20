[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20executablegameconceptandscopepipelinez"
version="1.0.0"
description="Executable Game Concept & Scope Pipeline (RM-237): concept scoring, scope/feasibility/risk/stage analysis with production/growth/foundry peer signals"
requires-python=">=3.11"

[project.scripts]
mem20executablegameconceptandscopepipelinez="mem20executablegameconceptandscopepipelinez.runtime:main"

[tool.setuptools]
packages=["mem20executablegameconceptandscopepipelinez"]
[tool.setuptools.package-data]
mem20executablegameconceptandscopepipelinez=["CAPABILITY.json","roadmap.json","web/*"]
