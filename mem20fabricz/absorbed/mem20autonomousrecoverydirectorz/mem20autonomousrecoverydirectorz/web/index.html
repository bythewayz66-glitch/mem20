<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Autonomous Recovery Director — cockpit</title><link rel="stylesheet" href="./style.css"/></head><body>
<header class="topbar"><div class="brand"><span class="dot"></span><div><h1>Autonomous Recovery Director</h1><p class="sub">triage/rollback/remediation · 6 recovery-specific peers</p></div></div><div class="api-config"><label>API</label><input id="api-base" placeholder="same origin"/><button id="api-save" class="ghost">Connect</button></div></header>
<main><section class="stats" id="stats"></section>
<div class="grid"><section class="panel"><div class="panel-head"><h2>Recovery report</h2><button id="run-report" class="primary small">Run report</button></div><pre id="report" class="output"></pre></section>
<section class="panel"><div class="panel-head"><h2>Peers & doctor</h2><button id="run-doctor" class="ghost small">Probe peers</button></div><div id="peers" class="list"></div><pre id="doctor" class="output" hidden></pre></section></div>
<div class="grid"><section class="panel"><div class="panel-head"><h2>Triage</h2></div><form id="triage-form" class="stack"><select name="severity"><option>critical</option><option selected>high</option><option>medium</option><option>low</option></select><button type="submit">Triage</button></form><pre id="ops" class="output"></pre></section>
<section class="panel"><div class="panel-head"><h2>Simulator & events</h2><div class="row"><button id="run-sim" class="ghost small">Simulate</button><button id="refresh-events" class="ghost small">Events</button></div></div><pre id="sim" class="output"></pre><ol id="events" class="events"></ol></section></div>
</main><div id="toast" class="toast" hidden></div><script src="./app.js" type="module"></script></body></html>
