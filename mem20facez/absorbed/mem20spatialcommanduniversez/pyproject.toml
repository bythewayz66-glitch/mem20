[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20spatialcommanduniversez"
version="1.0.0"
description="Spatial Command Universe with 6 peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20spatialcommanduniversez="mem20spatialcommanduniversez.runtime:main"
[tool.setuptools]
packages=["mem20spatialcommanduniversez"]
[tool.setuptools.package-data]
mem20spatialcommanduniversez=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
