[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20facez"
version = "1.0.0"
description = "mem20 interface/workspace crew runtime: 8-member registry/composition with 6-peer capture, dataflow, mission, canvas, sandbox, and blackboard signals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mem20", "crew", "runtime", "integration"]
dependencies = []

[project.scripts]
mem20facez = "mem20facez.cli:main"

[tool.setuptools]
packages = ["mem20facez"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
mem20facez = ["web/*"]
