[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20styleguideagentz"
version="1.0.0"
description="Style Guide Agent with 6 peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20styleguideagentz="mem20styleguideagentz.runtime:main"
[tool.setuptools]
packages=["mem20styleguideagentz"]
[tool.setuptools.package-data]
mem20styleguideagentz=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
