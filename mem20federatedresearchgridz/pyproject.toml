[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20federatedresearchgridz"
version="1.0.0"
description="Federated Research Grid (RM-043): distributed node search/aggregation with collective intelligence, CRDT merge, and priority/connector peer signals"
requires-python=">=3.11"

[project.scripts]
mem20federatedresearchgridz="mem20federatedresearchgridz.runtime:main"

[tool.setuptools]
packages=["mem20federatedresearchgridz"]
[tool.setuptools.package-data]
mem20federatedresearchgridz=["CAPABILITY.json","roadmap.json","web/*"]
