[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20gamebalancesimulatorz"
version="1.0.0"
description="Game Balance Simulator (RM-231): combat/progression/economy simulation with 6 peer signals; legacy domain preserved (#307)"
requires-python=">=3.11"

[project.scripts]
mem20gamebalancesimulatorz="mem20gamebalancesimulatorz.runtime:main"

[tool.setuptools]
packages=["mem20gamebalancesimulatorz"]
[tool.setuptools.package-data]
mem20gamebalancesimulatorz=["CAPABILITY.json","roadmap.json","web/*"]
