[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20gameplaysystemsdataandbalancepipelinez"
version="1.0.0"
description="Gameplay Systems Data & Balance Pipeline (RM-245): telemetry/analysis/tuning pipeline with 6 peer signals; legacy domain preserved"
requires-python=">=3.11"

[project.scripts]
mem20gameplaysystemsdataandbalancepipelinez="mem20gameplaysystemsdataandbalancepipelinez.runtime:main"

[tool.setuptools]
packages=["mem20gameplaysystemsdataandbalancepipelinez"]
[tool.setuptools.package-data]
mem20gameplaysystemsdataandbalancepipelinez=["CAPABILITY.json","roadmap.json","web/*"]
