[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20gameproductioncontrolcenterz"
version="1.0.0"
description="Game Production Control Center (RM-233): sprints/milestones/risk/health with meaningful team,cost,release,forge,resilience,asset peer integrations; legacy domain preserved"
requires-python=">=3.11"

[project.scripts]
mem20gameproductioncontrolcenterz="mem20gameproductioncontrolcenterz.runtime:main"

[tool.setuptools]
packages=["mem20gameproductioncontrolcenterz"]
[tool.setuptools.package-data]
mem20gameproductioncontrolcenterz=["CAPABILITY.json","roadmap.json","web/*"]
