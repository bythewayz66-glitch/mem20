[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20dynamicquestrewardcomposerz"
version="1.0.0"
description="Dynamic Quest Reward Composer with 6 peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20dynamicquestrewardcomposerz="mem20dynamicquestrewardcomposerz.runtime:main"
[tool.setuptools]
packages=["mem20dynamicquestrewardcomposerz"]
[tool.setuptools.package-data]
mem20dynamicquestrewardcomposerz=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
