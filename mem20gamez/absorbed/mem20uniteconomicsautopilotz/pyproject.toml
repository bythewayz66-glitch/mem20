[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20uniteconomicsautopilotz"
version="1.0.0"
description="Unit Economics Autopilot with 6 peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20uniteconomicsautopilotz="mem20uniteconomicsautopilotz.runtime:main"
[tool.setuptools]
