[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20gapz"
version = "0.1.0"
description = "Capability Gap Mapper — maps current vs required capabilities and recommends bridging actions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "mem20core>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.urls]
Homepage = "https://github.com/mem20/mem20gapz"

[tool.setuptools.packages.find]
where = ["."]
include = ["mem20gapz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]