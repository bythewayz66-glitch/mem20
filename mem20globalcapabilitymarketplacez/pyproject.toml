[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20globalcapabilitymarketplacez"
version="1.0.0"
description="Global Capability Marketplace (RM-218): listings/match/transactions with offer, trial, secure-capsule, query, and remix peer integrations; legacy domain preserved"
requires-python=">=3.11"

[project.scripts]
mem20globalcapabilitymarketplacez="mem20globalcapabilitymarketplacez.runtime:main"

[tool.setuptools]
packages=["mem20globalcapabilitymarketplacez"]
[tool.setuptools.package-data]
mem20globalcapabilitymarketplacez=["CAPABILITY.json","roadmap.json","web/*"]
