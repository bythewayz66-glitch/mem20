[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20deterministicconfigurationgraphz"
version="1.0.0"
description="Deterministic Configuration Graph with 6 peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20deterministicconfigurationgraphz="mem20deterministicconfigurationgraphz.runtime:main"
[tool.setuptools]
packages=["mem20deterministicconfigurationgraphz"]
[tool.setuptools.package-data]
mem20deterministicconfigurationgraphz=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
