[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20humancapabilitysuperplatformz"
version="1.0.0"
description="Human Capability Super-Platform (RM-220): capability search/assessment/growth with 6 peer integrations; legacy domain preserved (#319)"
requires-python=">=3.11"

[project.scripts]
mem20humancapabilitysuperplatformz="mem20humancapabilitysuperplatformz.runtime:main"

[tool.setuptools]
packages=["mem20humancapabilitysuperplatformz"]
[tool.setuptools.package-data]
mem20humancapabilitysuperplatformz=["CAPABILITY.json","roadmap.json","web/*"]
