<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Autonomous Sales Laboratory — cockpit</title><link rel="stylesheet" href="./style.css"/></head><body>
<header class="topbar"><div class="brand"><span class="dot"></span><div><h1>Autonomous Sales Laboratory</h1><p class="sub">leads/outreach/conversion · 6 sales-lab peers (anti-spam guarded)</p></div></div><div class="api-config"><label>API</label><input id="api-base" placeholder="same origin"/><button id="api-save" class="ghost">Connect</button></div></header>
<main><section class="stats" id="stats"></section>
<div class="grid"><section class="panel"><div class="panel-head"><h2>Lab report</h2><button id="run-report" class="primary small">Run report</button></div><pre id="report" class="output"></pre></section>
<section class="panel"><div class="panel-head"><h2>Peers & doctor</h2><button id="run-doctor" class="ghost small">Probe peers</button></div><div id="peers" class="list"></div><pre id="doctor" class="output" hidden></pre></section></div>
<div class="grid"><section class="panel"><div class="panel-head"><h2>Score lead</h2></div><form id="score-form" class="stack"><div class="row"><input name="budget" type="number" value="2000"/><input name="timeline" type="number" value="10"/></div><div class="row"><label><input name="authority" type="checkbox" checked/> authority</label><label><input name="need" type="checkbox" checked/> need</label></div><button type="submit">Score</button></form><pre id="ops" class="output"></pre></section>
<section class="panel"><div class="panel-head"><h2>Simulator & events</h2><div class="row"><button id="run-sim" class="ghost small">Simulate</button><button id="refresh-events" class="ghost small">Events</button></div></div><pre id="sim" class="output"></pre><ol id="events" class="events"></ol></section></div>
</main><div id="toast" class="toast" hidden></div><script src="./app.js" type="module"></script></body></html>
