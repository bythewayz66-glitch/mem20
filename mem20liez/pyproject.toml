[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20liez"
version = "0.1.0"
description = "Real-time micro-expression, voice-stress, emotion, manipulation and deception detection for mem20"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mem20" }]
dependencies = [
    "numpy",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
vision = []          # future: mediapipe / opencv extras
audio = []           # future: librosa / praat extras

[project.scripts]
fs-lie = "mem20liez.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mem20liez*"]
