[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20connectormarketplacez"
version = "0.1.0"
description = "Connector Marketplace — discover, evaluate, and combine reusable connectors."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mem20connectormarketplacez = "mem20connectormarketplacez:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mem20connectormarketplacez*"]

[tool.ruff]
target-version = "py311"
line-length = 100
