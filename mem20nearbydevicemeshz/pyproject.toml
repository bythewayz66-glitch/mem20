[project]
name = "mem20nearbydevicemeshz"
version = "1.0.0"
description = "Nearby Device Mesh — discover and combine trusted local devices over short-range and local networks"
requires-python = ">=3.11"

[project.scripts]
mem20nearbydevicemeshz = "mem20nearbydevicemeshz.runtime:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mem20nearbydevicemeshz", "mem20nearbydevicemeshz.*"]
