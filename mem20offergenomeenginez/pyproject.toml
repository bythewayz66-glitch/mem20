[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20offergenomeenginez"
version="1.0.0"
description="Offer Genome Engine with 6 peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20offergenomeenginez="mem20offergenomeenginez.runtime:main"
[tool.setuptools]
