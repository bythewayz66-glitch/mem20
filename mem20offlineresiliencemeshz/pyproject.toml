[project]
name = "mem20offlineresiliencemeshz"
version = "1.0.0"
description = "Offline Resilience Mesh — queue, retry, and sync across connectivity loss"
requires-python = ">=3.11"

[project.scripts]
mem20offlineresiliencemeshz = "mem20offlineresiliencemeshz.runtime:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mem20offlineresiliencemeshz", "mem20offlineresiliencemeshz.*"]
