[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20autonomoussoftwarefoundryz"
version="1.0.0"
description="Autonomous software foundry with 6 subsystem-specific peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20autonomoussoftwarefoundryz="mem20autonomoussoftwarefoundryz.runtime:main"
[tool.setuptools]
packages=["mem20autonomoussoftwarefoundryz"]
[tool.setuptools.package-data]
mem20autonomoussoftwarefoundryz=["CAPABILITY.json","ROADMAP.json","roadmap.json","ROADMAP-COVERAGE.json","web/*"]
