[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20datalocalityoptimizerz"
version="1.0.0"
description="Data Locality Optimizer with 6 peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20datalocalityoptimizerz="mem20datalocalityoptimizerz.runtime:main"
[tool.setuptools]
packages=["mem20datalocalityoptimizerz"]
[tool.setuptools.package-data]
mem20datalocalityoptimizerz=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
