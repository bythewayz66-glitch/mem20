[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20productionplanningandtaskorchestrationpipelinez"
version="1.0.0"
description="Production Planning and Task Orchestration Pipeline with 6 peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20productionplanningandtaskorchestrationpipelinez="mem20productionplanningandtaskorchestrationpipelinez.runtime:main"
[tool.setuptools]
packages=["mem20productionplanningandtaskorchestrationpipelinez"]
[tool.setuptools.package-data]
mem20productionplanningandtaskorchestrationpipelinez=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
