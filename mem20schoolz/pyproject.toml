[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20schoolz"
version="1.0.0"
description="mem20 school: unified training, certification, and apprenticeship system"
requires-python=">=3.11"

[project.scripts]
mem20schoolz="mem20schoolz.runtime:main"

[tool.setuptools]
packages=["mem20schoolz"]
[tool.setuptools.package-data]
mem20schoolz=["CAPABILITY.json","roadmap.json","web/*"]
