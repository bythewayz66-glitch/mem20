<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08111f" />
    <title>Edge Fleet Brain — node cockpit</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <div>
          <h1>Edge Fleet Brain</h1>
          <p class="sub">RM-041 · idle hardware as one capability-aware compute cloud</p>
        </div>
      </div>
      <div class="api-config">
        <label for="api-base">API</label>
        <input id="api-base" placeholder="http://127.0.0.1:8771" />
        <button id="api-save" class="ghost">Connect</button>
      </div>
    </header>

    <main>
      <section class="stats" id="stats" aria-live="polite"></section>

      <div class="grid">
        <section class="panel">
          <div class="panel-head">
            <h2>Nodes</h2>
            <button id="refresh-nodes" class="ghost small">Refresh</button>
          </div>
          <form id="node-form" class="stack">
            <div class="row">
              <input name="node_id" placeholder="node id" required />
              <select name="kind">
                <option value="server">server</option>
                <option value="laptop">laptop</option>
                <option value="phone">phone</option>
                <option value="appliance">appliance</option>
                <option value="edge_box">edge box</option>
              </select>
            </div>
            <div class="row">
              <input name="cpu_cores" type="number" min="1" value="8" placeholder="cores" />
              <input name="memory_gb" type="number" min="1" step="0.5" value="16" placeholder="memory GB" />
              <input name="gpu_count" type="number" min="0" value="0" placeholder="GPUs" />
            </div>
            <div class="row">
              <input name="capabilities" placeholder="capabilities: cpu,gpu,ml" />
              <input name="region" placeholder="region (local)" />
              <input name="price_per_hour" type="number" min="0" step="0.01" value="0" placeholder="$/h" />
            </div>
            <div class="row">
              <label class="check"><input type="checkbox" name="auto_capabilities" /> derive capabilities</label>
              <button type="submit">Register node</button>
            </div>
          </form>
          <div id="nodes" class="list"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Workloads</h2>
            <button id="dispatch-all" class="primary small">Dispatch queued</button>
          </div>
          <form id="workload-form" class="stack">
            <div class="row">
              <input name="workload_id" placeholder="workload id (optional)" />
              <input name="name" placeholder="description" />
            </div>
            <div class="row">
              <input name="cpu" type="number" min="0.1" step="0.1" value="2" placeholder="cpu" />
              <input name="memory_gb" type="number" min="0.1" step="0.5" value="2" placeholder="memory GB" />
              <input name="priority" type="number" min="0" max="100" value="50" placeholder="priority" />
            </div>
            <div class="row">
              <input name="required_capabilities" placeholder="needs: cpu,gpu" />
              <input name="duration_s" type="number" min="1" value="60" placeholder="duration s" />
              <input name="max_price_per_hour" type="number" min="0" step="0.01" placeholder="max $/h" />
            </div>
            <button type="submit">Submit workload</button>
          </form>
          <div id="workloads" class="list"></div>
        </section>
      </div>

      <div class="grid">
        <section class="panel">
          <div class="panel-head"><h2>Energy</h2><span class="hint">24 h projection</span></div>
          <div id="energy" class="list"></div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>Fault forecast</h2><span class="hint">next hour</span></div>
          <div id="faults" class="list"></div>
        </section>
      </div>

      <section class="panel">
        <div class="panel-head">
          <h2>Live events</h2>
          <div class="row">
            <button id="run-simulate" class="ghost small">Run simulator</button>
            <button id="run-doctor" class="ghost small">Probe ecosystem</button>
            <button id="rebalance" class="ghost small">Rebalance</button>
          </div>
        </div>
        <pre id="doctor" class="output" hidden></pre>
        <ol id="events" class="events"></ol>
      </section>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script src="./app.js" type="module"></script>
  </body>
</html>
