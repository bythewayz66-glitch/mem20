[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20causalroutingbrainz"
version="1.0.0"
description="Causal routing brain with 6 peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20causalroutingbrainz="mem20causalroutingbrainz.runtime:main"
[tool.setuptools]
packages=["mem20causalroutingbrainz"]
[tool.setuptools.package-data]
mem20causalroutingbrainz=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
