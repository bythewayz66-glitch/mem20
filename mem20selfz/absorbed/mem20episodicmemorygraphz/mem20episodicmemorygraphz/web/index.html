<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Episodic Memory Graph (RM-021)</title><link rel="stylesheet" href="/style.css"/></head>
<body><header><h1>Episodic Memory Graph <small>RM-021</small></h1>
<div><button id="r">Refresh</button> <button id="d">Doctor</button> <button id="g">Graph</button> <button id="s">Simulate</button></div></header>
<main>
<div class="panel"><h2>Status</h2><pre id="st">loading</pre></div>
<div class="grid"><div class="panel"><h2>Create / recall</h2>
<label>Title <input id="t" value="shipped fix"/></label><button id="c">Create</button>
<label>Query <input id="q" value="fix"/></label><button id="rec">Recall</button></div>
<div class="panel"><h2>Episodes</h2><pre id="eps"></pre></div></div>
<div class="panel"><h2>Result</h2><pre id="out"></pre></div>
</main><script src="/app.js"></script></body></html>
