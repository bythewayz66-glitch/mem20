[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20rewardforgez"
version="1.0.0"
description="Reward Forge with 6 peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20rewardforgez="mem20rewardforgez.runtime:main"
[tool.setuptools]
packages=["mem20rewardforgez"]
[tool.setuptools.package-data]
mem20rewardforgez=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
