[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20capabilitymarketplacez"
version = "0.1.0"
description = "Capability Marketplace — discover, trial, install, rate, and combine reusable capabilities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mem20capabilitymarketplacez = "mem20capabilitymarketplacez:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mem20capabilitymarketplacez*"]

[tool.ruff]
target-version = "py311"
line-length = 100
