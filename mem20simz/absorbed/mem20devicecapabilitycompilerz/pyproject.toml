[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20devicecapabilitycompilerz"
version="1.0.0"
description="Device Capability Compiler with 6 peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20devicecapabilitycompilerz="mem20devicecapabilitycompilerz.runtime:main"
[tool.setuptools]
packages=["mem20devicecapabilitycompilerz"]
[tool.setuptools.package-data]
mem20devicecapabilitycompilerz=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
