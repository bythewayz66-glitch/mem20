[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "mem20simz"
version = "1.0.0"
description = "mem20 simulator runtime with 6 peers, HTTP cockpit, MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
mem20simz = "mem20simz.runtime:main"
[tool.setuptools]
packages = ["mem20simz"]
[tool.setuptools.package-data]
mem20simz=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
