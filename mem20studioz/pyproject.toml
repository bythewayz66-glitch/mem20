[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "mem20studioz"
version = "1.0.0"
description = "mem20 studio runtime with 6 peers, HTTP cockpit, MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
mem20studioz = "mem20studioz.runtime:main"
[tool.setuptools]
packages = ["mem20studioz"]
[tool.setuptools.package-data]
mem20studioz=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
