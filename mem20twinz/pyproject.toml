[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "mem20twinz"
version = "1.0.0"
description = "mem20 twin runtime with 6 peers, HTTP cockpit, MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
mem20twinz = "mem20twinz.runtime:main"
[tool.setuptools]
packages = ["mem20twinz"]
[tool.setuptools.package-data]
mem20twinz=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
