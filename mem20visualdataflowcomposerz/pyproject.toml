[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mem20visualdataflowcomposerz"
version="1.0.0"
description="Visual Dataflow Composer with 6 peers, HTTP cockpit, MCP"
requires-python=">=3.11"
[project.scripts]
mem20visualdataflowcomposerz="mem20visualdataflowcomposerz.runtime:main"
[tool.setuptools]
packages=["mem20visualdataflowcomposerz"]
[tool.setuptools.package-data]
mem20visualdataflowcomposerz=["CAPABILITY.json","ROADMAP.json","roadmap.json","web/*"]
