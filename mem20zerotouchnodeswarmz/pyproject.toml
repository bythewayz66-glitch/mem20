[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20zerotouchnodeswarmz"
version="1.0.0"
description="Zero-touch node swarm: discovery, joining, task distribution, healing"
requires-python=">=3.11"

[project.scripts]
mem20zerotouchnodeswarmz="mem20zerotouchnodeswarmz.runtime:main"

[tool.setuptools]
packages=["mem20zerotouchnodeswarmz"]
[tool.setuptools.package-data]
mem20zerotouchnodeswarmz=["CAPABILITY.json","roadmap.json"]
