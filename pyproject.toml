[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20"
version = "4.0.0"
description = "mem20 — trusted, auditable memory + world-model layer for agents (MCP server)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["agent", "memory", "mcp", "world-model", "cognitive"]
dependencies = [
    "mcp>=2.1.1",
    # mcp-types and aiohttp are imported at MODULE SCOPE by modules the server
    # loads before it can serve a request (mcp/server.py:48 and
    # mcp/tools/a2a_tools.py:19). Neither ships as a dependency of `mcp`, so
    # omitting them here produces an install that cannot boot. requirements.txt
    # has declared both since 78d28ad; this list had not caught up.
    "mcp-types>=2.3.0",
    "aiohttp>=3.14.5",
    "pydantic>=2.13.4",
    "anyio>=4.14.2",
    "numpy>=1.24",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
# Dev: run the test suite on a clean clone.
dev = ["pytest>=7", "pytest-asyncio", "hnswlib"]
# Vector backends (optional - install extras to use)
faiss = ["faiss-cpu>=1.7.4"]
pgvector = ["psycopg[pool]>=3.1", "pgvector>=0.2"]
qdrant = ["qdrant-client>=1.8"]
lancedb = ["lancedb>=0.8"]
milvus = ["pymilvus>=2.4"]
weaviate = ["weaviate-client>=4.0"]
# All vector backends
all-backends = ["faiss-cpu>=1.7.4", "psycopg[pool]>=3.1", "pgvector>=0.2", "qdrant-client>=1.8", "lancedb>=0.8", "pymilvus>=2.4", "weaviate-client>=4.0"]
# Optional integrations are EXTERNAL APPLICATIONS, not pip packages.
# Blender / Unity must be installed on the host (see requirements-optional.txt).
integrations = []

[project.scripts]
# Run via the launcher, which locates the bundled MCP server directory and runs
# it as a script (equivalent to `python mcp/mcp_server.py`). This avoids
# importing the local `mcp/` dir as a package, which would shadow the `mcp` SDK.
mem20-mcp = "launcher:main"
# Query aggregated install metrics from the local event log, or run the
# collector dashboard server (MEM20_COLLECTOR_PORT=9090).
mem20-metrics = "metrics_collector:main"
# Link mem20's own console scripts into a default-PATH directory so they resolve
# from systemd units, cron jobs and `sh -c` — not just an interactive shell.
# Excluded on purpose: mem20-metrics, which is a blocking server, not a command.
mem20-path = "mem20path:main"
# Boot, port-deconflict, and health-test the full mem20 web stack.
mem20-thestack = "mem20thestack:main"

[tool.setuptools]
packages = ["memory_engine"]
# Repo-root top-level modules. `memory.py` is the real memory engine (global
# memory / ledger / vectors) and it imports the standalone `procedural.py`
# at module scope, so both must be installed together. `launcher.py` backs the
# `mem20-mcp` console script. `metrics_collector.py` is the standalone
# install-metrics collector server. `mem20path.py` backs `mem20-path`, which
# keeps every mem20 CLI resolvable from a non-interactive context.
# `mem20thestack.py` boots, port-deconflicts, and tests the full web stack.
py-modules = ["memory", "metrics_collector", "procedural", "launcher", "mem20path", "mem20thestack"]

[project.entry-points."mem20.vector_backends"]
faiss = "memory_engine.backends.faiss_backend:FaissBackend"
memory = "memory_engine.backends.memory_backend:MemoryBackend"
pgvector = "memory_engine.backends.pgvector_backend:PgVectorBackend"
qdrant = "memory_engine.backends.qdrant_backend:QdrantBackend"
lancedb = "memory_engine.backends.lancedb_backend:LanceDBBackend"
milvus = "memory_engine.backends.milvus_backend:MilvusBackend"
weaviate = "memory_engine.backends.weaviate_backend:WeaviateBackend"

[tool.pytest.ini_options]
testpaths = ["tests"]
