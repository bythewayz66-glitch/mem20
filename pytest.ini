[pytest]
# The nested mem20 packages live at <project>/<name>/, so the outer project
# directory shadows the real package as a namespace package. pytest's default
# "prepend" import mode inserts the outer directory at sys.path[0], which
# produces ImportError on in-place imports. "importlib" mode avoids that.
addopts = --import-mode=importlib
# Default collects the whole estate. Use `pytest <package>` to narrow.
testpaths = .
# Issue #18: exclude top-level test/ scratch so basename collisions cannot break collection.
norecursedirs = .git .venv venv node_modules __pycache__ site-packages secrets backups data store build dist mem test
markers =
    unit: fast tests with no optional native deps (CI default)
    integration: needs optional deps (torch, blender, live network, etc.)
