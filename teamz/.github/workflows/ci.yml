name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI never writes back to the repo.
permissions:
  contents: read

# A new push to the same ref cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: yarn run typecheck

      - name: Test
        run: yarn run test

      - name: Build
        run: yarn run build
